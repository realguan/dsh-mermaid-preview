<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-mermaid-preview · README screenshots</title>
<style>
/* ---- dsh design tokens: the two alias layers, copied verbatim ---------- */
/* LIGHT_TOKENS */
/* DARK_TOKENS */

/* ---- the dsh shell, reduced to what a reading column needs ------------- */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--dsw-alias-bg-base);
  color: var(--dsw-alias-label-primary);
  font-family: var(--dsh-font-family-text-default, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif);
  font-size: 14px;
  line-height: 22px;
  -webkit-font-smoothing: antialiased;
}
#shell { display: flex; min-height: 100vh; }

/* left rail */
#rail {
  flex: 0 0 232px;
  border-right: 0.5px solid var(--dsw-alias-border-l1);
  padding: 14px 10px;
  background: var(--dsw-alias-bg-layer-1);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#rail .brand {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px 14px;
  font-weight: 600; font-size: 13px;
  color: var(--dsw-alias-label-primary);
}
#rail .brand svg { flex: none; }
#rail .nav {
  display: flex; align-items: center; gap: 9px;
  padding: 6px 8px; border-radius: var(--dsw-radius-sm);
  font-size: 13px; color: var(--dsw-alias-label-secondary);
}
#rail .nav.active {
  background: var(--dsw-alias-interactive-bg-hover);
  color: var(--dsw-alias-label-primary);
  font-weight: 500;
}
#rail .nav .glyph {
  width: 16px; height: 16px; flex: none;
  border-radius: 4px;
  background: var(--dsw-alias-label-tertiary);
  opacity: 0.35;
}
#rail .group {
  margin: 15px 8px 5px;
  font-size: 11px; line-height: 16px;
  color: var(--dsw-alias-label-tertiary);
  letter-spacing: 0.02em;
}
#rail .spacer { flex: 1 1 auto; }

/* conversation column */
#main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
#topbar {
  display: flex; align-items: center; gap: 10px;
  height: 45px; flex: none;
  padding: 0 20px;
  border-bottom: 0.5px solid var(--dsw-alias-border-l1);
  font-size: 13px; color: var(--dsw-alias-label-secondary);
}
#topbar .title { color: var(--dsw-alias-label-primary); font-weight: 500; }
#topbar .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--dsw-alias-label-tertiary); }
#topbar .right { margin-left: auto; display: flex; gap: 6px; }
#topbar .pill {
  padding: 3px 9px; border-radius: 999px; font-size: 12px;
  border: 0.5px solid var(--dsw-alias-border-l2);
  color: var(--dsw-alias-label-secondary);
}

#scroll { flex: 1 1 auto; overflow: hidden; padding: 26px 0 48px; }
#thread {
  width: 760px; max-width: calc(100% - 48px);
  margin: 0 auto;
}
.msg { margin: 0 0 26px; }
.msg .who {
  display: flex; align-items: center; gap: 7px;
  margin-bottom: 7px;
  font-size: 12px; line-height: 18px; font-weight: 600;
  color: var(--dsw-alias-label-secondary);
}
.msg .who .avatar {
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--dsw-alias-markdown-tag);
  border: 0.5px solid var(--dsw-alias-border-l2);
}
.msg.user .bubble {
  padding: 10px 14px;
  border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-markdown-code-block);
  border: 0.5px solid var(--dsw-alias-border-l1);
  color: var(--dsw-alias-label-primary);
}
.msg p { margin: 0 0 10px; }
.msg p:last-child { margin-bottom: 0; }
.msg ul { margin: 0 0 10px; padding-left: 20px; }
.msg li { margin: 0 0 3px; }
.msg strong { font-weight: 600; }
.msg code {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  font-size: 12.5px;
  padding: 1px 5px;
  border-radius: var(--dsw-radius-xs);
  background: var(--dsw-alias-markdown-tag);
}

/* ---- the code card surface the plugin decorates ------------------------ */
.md-code-block {
  margin: 12px 0 14px;
  border: 0.5px solid var(--dsw-alias-border-l2);
  border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-markdown-code-block);
  overflow: hidden;
}
.md-code-block > .shell-banner {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px 5px 12px;
  border-bottom: 0.5px solid var(--dsw-alias-border-l1);
  color: var(--dsw-alias-label-tertiary);
  font-size: 12px; line-height: 20px;
}
.md-code-block > .shell-banner .spacer { flex: 1 1 auto; }
.md-code-block > .shell-banner .tool { opacity: 0.65; font-size: 11.5px; }
.md-code-block > [data-code-block-content] { padding: 10px 0; }
.md-code-block pre {
  margin: 0; padding: 0 14px; overflow: hidden;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  font-size: 12.5px; line-height: 20px;
  color: var(--dsw-alias-label-secondary);
}
.md-code-block code { font: inherit; }

/* composer: the shell's input row, so a conversation shot reads as one */
#composer { flex: none; padding: 10px 24px 18px; }
#composer .box {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 12px 11px 14px;
  border: 0.5px solid var(--dsw-alias-border-l2);
  border-radius: var(--dsw-radius-lg);
  background: var(--dsw-alias-bg-layer-1);
  box-shadow: var(--dsw-elevation-soft);
  width: 760px; max-width: 100%;
  margin: 0 auto;
  font-size: 13.5px;
  color: var(--dsw-alias-label-tertiary);
}
#composer .placeholder { flex: 1 1 auto; }
#composer .send {
  flex: none;
  width: 26px; height: 26px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: var(--dsw-alias-label-primary);
  color: var(--dsw-alias-bg-base);
  opacity: 0.9;
}

/* the rail is decorative for these shots */
#rail, #topbar, #composer { user-select: none; }
</style>
</head>
<body>
<div id="shell">
  <aside id="rail" aria-hidden="true">
    <div class="brand">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect width="24" height="24" rx="7" fill="var(--dsw-alias-label-primary)" opacity="0.88"/>
        <path d="M7 12.5 10.5 16 17 8.5" stroke="var(--dsw-alias-bg-base)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>DeepSeek Harness</span>
    </div>
    <div class="nav"><span class="glyph"></span>新建会话</div>
    <div class="nav active"><span class="glyph"></span>会话</div>
    <div class="nav"><span class="glyph"></span>文件</div>
    <div class="nav"><span class="glyph"></span>终端</div>
    <div class="group">实验性插件</div>
    <div class="nav"><span class="glyph"></span>插件市场</div>
    <div class="nav"><span class="glyph"></span>设置</div>
    <div class="spacer"></div>
    <div class="nav"><span class="glyph"></span>realguan</div>
  </aside>
  <div id="main">
    <div id="topbar">
      <span class="title">渲染性能复盘</span>
      <span class="dot"></span>
      <span>main</span>
      <span style="margin-left:auto" class="right">
        <span class="pill">dsh-mermaid-preview</span>
      </span>
    </div>
    <div id="scroll"><div id="thread"></div></div>
    <div id="composer" aria-hidden="true">
      <div class="box">
        <span class="placeholder">给 DeepSeek 发消息…</span>
        <span class="send">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M8 13V3M8 3 3.5 7.5M8 3l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </div>
    </div>
  </div>
</div>
<script type="module" src="/shot.js"></script>
</body>
</html>
