<!doctype html>
<html lang="en" data-bench>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-mermaid-preview · render benchmark</title>
<style>
  /* Minimal stand-in for the dsh Web shell: a sidebar and a message thread.
     Only what affects layout cost is reproduced: a fixed-width reading column,
     message blocks with their own typography, and code cards with a bordered
     surface. No fonts are downloaded — the harness must not measure the
     network. */
  :root {
    color-scheme: light;
    --bench-column: 860px;
    --dsw-alias-label-primary: #0f1115;
    --dsw-alias-label-secondary: #61666b;
    --dsw-alias-label-tertiary: #81868c;
    --dsw-alias-surface: #ffffff;
    --dsw-alias-surface-raised: #f7f8f9;
    --dsw-alias-border: #e4e6e8;
  }
  body[data-ds-dark-theme] {
    color-scheme: dark;
    --dsw-alias-label-primary: #f2f3f5;
    --dsw-alias-label-secondary: #a9adb2;
    --dsw-alias-label-tertiary: #81868c;
    --dsw-alias-surface: #17181a;
    --dsw-alias-surface-raised: #1f2124;
    --dsw-alias-border: #2c2f33;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--dsw-alias-surface);
    color: var(--dsw-alias-label-primary);
    font: 14px/22px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #app { display: flex; min-height: 100vh; align-items: flex-start; }
  #sidebar {
    flex: 0 0 260px;
    position: sticky;
    top: 0;
    height: 100vh;
    border-right: 1px solid var(--dsw-alias-border);
    padding: 16px;
    overflow: hidden;
  }
  #sidebar .row { height: 22px; margin-bottom: 10px; border-radius: 6px; background: var(--dsw-alias-surface-raised); }
  #sidebar .row.short { width: 60%; }
  #thread {
    flex: 1 1 auto;
    min-width: 0;
    padding: 24px 32px 0;
    max-width: calc(var(--bench-column) + 64px);
  }
  .msg { margin: 0 0 28px; }
  .msg-role {
    font-size: 12px;
    line-height: 18px;
    font-weight: 600;
    color: var(--dsw-alias-label-secondary);
    margin-bottom: 6px;
  }
  .msg p { margin: 0 0 10px; }
  .msg li { margin: 0 0 4px 18px; }
  .msg h3 { font-size: 15px; line-height: 24px; margin: 14px 0 8px; }
  .bench-note { font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-secondary); }
  /* ---- code card surface (the shape the plugin decorates) ---- */
  .md-code-block {
    margin: 12px 0;
    border: 1px solid var(--dsw-alias-border);
    border-radius: 12px;
    background: var(--dsw-alias-surface-raised);
    overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 12.5px;
    line-height: 20px;
  }
  .md-code-block > .bench-banner-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px 6px 12px;
    border-bottom: 1px solid var(--dsw-alias-border);
    color: var(--dsw-alias-label-tertiary);
    font-size: 12px;
  }
  .md-code-block > [data-code-block-content] { padding: 10px 0; }
  .md-code-block pre { margin: 0; padding: 0 14px; overflow: auto; }
  .md-code-block code { font: inherit; }
  /* NOTE: [data-dsh-mermaid-banner] / [data-dsh-mermaid-hidden] styling is the
     plugin's own (it injects a <style> on apply); the page deliberately does
     not duplicate it, so the harness measures the plugin's real stylesheet. */
  /* ---- the measured region: 2400px tall, cards in normal flow ---- */
  #cards {
    min-height: 2400px;
    display: block;
    width: 100%;
  }
  #cards > .md-code-block { margin: 0 0 16px; }
  /* benchmark-only: content-visibility experiment */
  html[data-bench-cv='on'] .dsh-mermaid-canvas {
    content-visibility: auto;
    contain-intrinsic-size: auto 420px;
  }
  /* benchmark-only: style/layout-containment experiment */
  html[data-bench-contain='on'] .dsh-mermaid-canvas {
    contain: layout style paint;
  }
  #bench-status {
    position: fixed;
    right: 12px;
    bottom: 12px;
    z-index: 10;
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.72);
    color: #fff;
    font: 12px/18px ui-monospace, monospace;
  }
</style>
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-hidden="true"><div class="bench-sidebar-filler"></div></aside>
    <main id="thread"><div id="bench-conversation"></div><div id="cards"></div></main>
  </div>
  <div id="bench-status">loading…</div>
  <script type="module" src="/bench/page.js"></script>
</body>
</html>
