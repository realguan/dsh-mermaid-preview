<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>C</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden;background:#ffffff;color:#1c1e21;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.title{font-size:52px;font-weight:800;letter-spacing:.5px;color:#1a1f36;margin-bottom:14px}
.subtitle{font-size:18px;color:#6b7280;max-width:800px;line-height:1.6;margin-bottom:44px}
.subtitle code{background:#f0f2f5;border:1px solid #dde0e5;border-radius:5px;padding:2px 8px;font-size:15px;color:#3a3f4b}
.row{display:flex;gap:14px;align-items:center}
.tag{font-size:13px;padding:5px 16px;border-radius:999px;font-weight:500}
.tag.green{color:#2f9e44;background:#e6f4ea;border:1px solid rgba(47,158,68,.25)}
.tag.purple{color:#7c3aed;background:#ede9fe;border:1px solid rgba(124,58,237,.2)}
.tag.orange{color:#ea580c;background:#fff1eb;border:1px solid rgba(234,88,12,.2)}
.mini-chart{margin-top:36px;opacity:.55}
.foot{position:absolute;bottom:28px;left:0;right:0;display:flex;justify-content:space-between;padding:0 48px;font-size:12px;color:#9ca3af}
</style>
</head>
<body>
<div class="title">dsh-mermaid-preview</div>
<div class="subtitle">DeepSeek Harness Web 的 Mermaid 渲染插件<br/>无需修改源码 · 跟随明暗主题 · 零依赖演示页</div>
<div class="row">
<span class="tag green">flowchart</span>
<span class="tag purple">sequenceDiagram</span>
<span class="tag orange">classDiagram</span>
<span class="tag green">gantt</span>
<span class="tag purple">mindmap</span>
</div>
<div class="mini-chart"><svg width="420" height="100" viewBox="0 0 420 100" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="20" width="80" height="40" rx="6" fill="#e6f4ea" stroke="#2f9e44" stroke-width="1.5"/><text x="40" y="45" text-anchor="middle" font-size="11" fill="#2f9e44">责任人</text>
<line x1="80" y1="40" x2="140" y2="40" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="140" y="10" width="90" height="60" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="185" y="35" text-anchor="middle" font-size="11" fill="#7c3aed">平台侧</text><text x="185" y="52" text-anchor="middle" font-size="9" fill="#7c3aed">执行发起</text>
<line x1="230" y1="40" x2="290" y2="40" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="290" y="20" width="80" height="40" rx="6" fill="#fff1eb" stroke="#ea580c" stroke-width="1.5"/><text x="330" y="45" text-anchor="middle" font-size="11" fill="#ea580c">Agent</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#9ca3af"/></marker></defs>
</svg></div>
<div class="foot"><span>v0.1.0 · MIT</span><span>github.com/realguan/dsh-mermaid-preview</span></div>
<script>document.title='banner-c [ready]'</script>
</body>
</html>
